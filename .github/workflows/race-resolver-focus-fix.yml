name: Apply resolver race and focus style fix

"on":
  push:
    branches:
      - playback-faststart
    paths:
      - .github/workflows/race-resolver-focus-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback-faststart

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # HOME: custom button style owns the focused appearance so tvOS
          # cannot add its outer white NavigationLink focus frame.
          home = Path('TubeTV/HomeView.swift')
          h = home.read_text()
          style_marker = 'struct VideoRow: View {\n'
          style = '''struct TubeTVVideoButtonStyle: ButtonStyle {\n    func makeBody(configuration: Configuration) -> some View {\n        configuration.label\n            .contentShape(Rectangle())\n            .opacity(configuration.isPressed ? 0.88 : 1.0)\n            .focusEffectDisabled()\n    }\n}\n\n'''
          if 'struct TubeTVVideoButtonStyle: ButtonStyle' not in h:
              if style_marker not in h:
                  raise SystemExit('VideoRow marker missing')
              h = h.replace(style_marker, style + style_marker, 1)
          old = '''                        .buttonStyle(.plain)\n                        .focusEffectDisabled()\n                        .onAppear {\n'''
          new = '''                        .buttonStyle(TubeTVVideoButtonStyle())\n                        .focusEffectDisabled()\n                        .onAppear {\n'''
          if old not in h:
              raise SystemExit('Home NavigationLink style marker missing')
          h = h.replace(old, new, 1)
          home.write_text(h)

          search = Path('TubeTV/SearchView.swift')
          q = search.read_text()
          old = '''            .buttonStyle(.plain)\n            .focusEffectDisabled()\n\n        case .channel(let channel):\n'''
          new = '''            .buttonStyle(TubeTVVideoButtonStyle())\n            .focusEffectDisabled()\n\n        case .channel(let channel):\n'''
          if old not in q:
              raise SystemExit('Search video style marker missing')
          search.write_text(q.replace(old, new, 1))

          # STREAM RESOLVER: do not persist one profile for all videos.
          stream = Path('TubeTV/StreamResolver.swift')
          s = stream.read_text()
          start = s.index('    static func resolveYouTubeVideo(\n')
          end = s.index('    private static func resolveAuthenticatedWithTimeout(\n', start)
          replacement = '''    static func resolveYouTubeVideo(\n        videoID: String,\n        preferredQuality: String = "Auto",\n        excludingProfiles: Set<String> = []\n    ) async throws -> PlaybackSource {\n        guard !videoID.isEmpty else {\n            throw StreamResolverError.invalidVideoID\n        }\n\n        let isInitialAttempt = excludingProfiles.isEmpty\n        let allowed =\n            await StreamResolutionBudget.shared.beginAttempt(\n                videoID: videoID,\n                reset: isInitialAttempt\n            )\n\n        guard allowed else {\n            throw StreamResolverError.noPlayableStream\n        }\n\n        // Every video is resolved independently. A profile that worked for\n        // video A is only a hint in SmartTube, never a reason to starve the\n        // profiles needed by video B. TubeTV now races compatible profiles\n        // inside AlternativePlayerService and keeps this outer deadline only\n        // as a hard anti-hang guard.\n        return try await resolveWithTimeout(\n            videoID: videoID,\n            preferredQuality: preferredQuality,\n            excludingProfiles: excludingProfiles,\n            timeoutSeconds: isInitialAttempt ? 9 : 5\n        )\n    }\n\n'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('timeoutSeconds: 3\n                )', 'timeoutSeconds: 2\n                )', 1)
          sign_block = '''            if case .signInRequired = error {\n                throw error\n            }\n\n            meaningfulError = error\n'''
          if sign_block not in s:
              raise SystemExit('signInRequired fallback marker missing')
          s = s.replace(sign_block, '''            // A single client may require login while another client or\n            // YouTubeKit still exposes a playable stream. Remember the\n            // error, but never stop the fallback chain here.\n            meaningfulError = error\n''', 1)
          stream.write_text(s)

          # ALTERNATIVE PLAYER: race several clients instead of spending the
          # whole global budget sequentially on the first few profiles.
          alt = Path('TubeTV/AlternativePlayerService.swift')
          a = alt.read_text()
          a = a.replace(
              'private struct AlternativePlayerClient {',
              'private struct AlternativePlayerClient: @unchecked Sendable {',
              1
          )
          actor_marker = 'actor AlternativePlayerService {\n'
          outcome = '''private enum AlternativeProbeOutcome: @unchecked Sendable {\n    case source(PlaybackSource, String)\n    case signInRequired\n    case ipBlocked(String)\n    case failed\n    case timeout\n}\n\nprivate struct AlternativeRaceResult {\n    let source: PlaybackSource?\n    let sawSignInRequired: Bool\n}\n\n'''
          if 'private enum AlternativeProbeOutcome' not in a:
              if actor_marker not in a:
                  raise SystemExit('Alternative actor marker missing')
              a = a.replace(actor_marker, outcome + actor_marker, 1)

          func_start = a.index('    func resolve(\n        videoID: String,\n        preferredQuality: String,\n        excludingProfiles: Set<String> = []\n    ) async throws -> PlaybackSource {\n')
          func_end = a.index('    func markPlaybackSuccessful(\n', func_start)
          new_func = '''    func resolve(\n        videoID: String,\n        preferredQuality: String,\n        excludingProfiles: Set<String> = []\n    ) async throws -> PlaybackSource {\n        let availableClients =\n            clients.filter {\n                !excludingProfiles.contains($0.profile)\n            }\n\n        if visitorData == nil,\n           let bootstrapVisitor =\n                await SmartTubeAuthService\n                    .shared.cachedVisitorData(),\n           !bootstrapVisitor.isEmpty {\n            visitorData = bootstrapVisitor\n        }\n\n        try Task.checkCancellation()\n\n        // First wave: clients most likely to expose Apple-native HLS/muxed\n        // formats. Second wave: compatibility/web clients. Each wave races\n        // concurrently, so a slow or unsuitable profile cannot block the\n        // profiles that work for a different video.\n        let fastProfiles: Set<String> = [\n            "VISIONOS",\n            "TV_DOWNGRADED",\n            "IOS",\n            "ANDROID_VR"\n        ]\n        let fastClients = availableClients.filter {\n            fastProfiles.contains($0.profile)\n        }\n        let compatibilityClients = availableClients.filter {\n            !fastProfiles.contains($0.profile)\n        }\n\n        var sawSignInRequired = false\n\n        let fast = try await raceClients(\n            fastClients,\n            videoID: videoID,\n            preferredQuality: preferredQuality,\n            timeoutSeconds: 3.2\n        )\n        if let source = fast.source {\n            return source\n        }\n        sawSignInRequired =\n            sawSignInRequired || fast.sawSignInRequired\n\n        try Task.checkCancellation()\n\n        let compatibility = try await raceClients(\n            compatibilityClients,\n            videoID: videoID,\n            preferredQuality: preferredQuality,\n            timeoutSeconds: 3.2\n        )\n        if let source = compatibility.source {\n            return source\n        }\n        sawSignInRequired =\n            sawSignInRequired\n            || compatibility.sawSignInRequired\n\n        if sawSignInRequired {\n            throw StreamResolverError.signInRequired\n        }\n\n        throw StreamResolverError.noPlayableStream\n    }\n\n    private func raceClients(\n        _ clients: [AlternativePlayerClient],\n        videoID: String,\n        preferredQuality: String,\n        timeoutSeconds: TimeInterval\n    ) async throws -> AlternativeRaceResult {\n        guard !clients.isEmpty else {\n            return AlternativeRaceResult(\n                source: nil,\n                sawSignInRequired: false\n            )\n        }\n\n        let timeoutNanoseconds = UInt64(\n            max(0.5, timeoutSeconds) * 1_000_000_000\n        )\n\n        return try await withThrowingTaskGroup(\n            of: AlternativeProbeOutcome.self\n        ) { group in\n            for client in clients {\n                group.addTask { [self] in\n                    await self.probeClient(\n                        client,\n                        videoID: videoID,\n                        preferredQuality: preferredQuality\n                    )\n                }\n            }\n\n            group.addTask {\n                do {\n                    try await Task.sleep(\n                        nanoseconds: timeoutNanoseconds\n                    )\n                } catch {\n                    return .failed\n                }\n                return .timeout\n            }\n\n            var sawSignInRequired = false\n\n            while let outcome = try await group.next() {\n                switch outcome {\n                case .source(let source, let profile):\n                    group.cancelAll()\n                    logger.notice(\n                        "Race winner client=\\(profile, privacy: .public)"\n                    )\n                    return AlternativeRaceResult(\n                        source: source,\n                        sawSignInRequired:\n                            sawSignInRequired\n                    )\n\n                case .signInRequired:\n                    sawSignInRequired = true\n\n                case .ipBlocked(let reason):\n                    group.cancelAll()\n                    throw StreamResolverError.ipBlocked(\n                        reason\n                    )\n\n                case .timeout:\n                    group.cancelAll()\n                    return AlternativeRaceResult(\n                        source: nil,\n                        sawSignInRequired:\n                            sawSignInRequired\n                    )\n\n                case .failed:\n                    continue\n                }\n            }\n\n            return AlternativeRaceResult(\n                source: nil,\n                sawSignInRequired: sawSignInRequired\n            )\n        }\n    }\n\n    private func probeClient(\n        _ client: AlternativePlayerClient,\n        videoID: String,\n        preferredQuality: String\n    ) async -> AlternativeProbeOutcome {\n        let startedAt = Date()\n\n        do {\n            try Task.checkCancellation()\n\n            if client.seedWebSession,\n               visitorData == nil {\n                await seedWebSession(\n                    videoID: videoID\n                )\n                try Task.checkCancellation()\n            }\n\n            if let source = try await resolve(\n                videoID: videoID,\n                preferredQuality: preferredQuality,\n                client: client\n            ) {\n                let elapsedMs = Int(\n                    Date().timeIntervalSince(startedAt)\n                        * 1_000\n                )\n                logger.notice(\n                    "Probe playable client=\\(client.profile, privacy: .public) ms=\\(elapsedMs, privacy: .public)"\n                )\n                return .source(\n                    source,\n                    client.profile\n                )\n            }\n        } catch let error as StreamResolverError {\n            if case .ipBlocked(let reason) = error {\n                return .ipBlocked(reason)\n            }\n            if case .signInRequired = error {\n                return .signInRequired\n            }\n        } catch {\n            if error is CancellationError {\n                return .failed\n            }\n        }\n\n        return .failed\n    }\n\n'''
          a = a[:func_start] + new_func + a[func_end:]

          # No cross-video preferred profile: these functions now only log\n          # playback verification results.\n          mark_start = a.index('    func markPlaybackSuccessful(\n')
          mark_end = a.index('    private func seedWebSession(\n', mark_start)
          new_marks = '''    func markPlaybackSuccessful(\n        profile: String\n    ) {\n        logger.notice(\n            "Playback profile confirmed=\\(profile, privacy: .public)"\n        )\n    }\n\n    func markPlaybackFailed(\n        profile: String\n    ) {\n        logger.notice(\n            "Playback profile rejected=\\(profile, privacy: .public)"\n        )\n    }\n\n'''
          a = a[:mark_start] + new_marks + a[mark_end:]
          a = a.replace('    private var lastSuccessfulProfile: String?\n', '', 1)
          a = a.replace('timeoutInterval: 8\n        )', 'timeoutInterval: 1.5\n        )', 1)
          alt.write_text(a)
          PY

      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git rm .github/workflows/race-resolver-focus-fix.yml
          git add TubeTV/HomeView.swift TubeTV/SearchView.swift TubeTV/StreamResolver.swift TubeTV/AlternativePlayerService.swift
          git commit -m "Race playback clients and remove tvOS focus frame"
          git push origin HEAD:playback-faststart
