name: Tighten playback seed timeout

"on":
  push:
    branches:
      - playback-faststart
    paths:
      - .github/workflows/seed-timeout-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback-faststart
      - name: Patch and self remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('TubeTV/AlternativePlayerService.swift')
          text = path.read_text()
          old = '''        var request = URLRequest(\n            url: url,\n            cachePolicy: .reloadIgnoringLocalCacheData,\n            timeoutInterval: 8\n        )\n'''
          new = '''        var request = URLRequest(\n            url: url,\n            cachePolicy: .reloadIgnoringLocalCacheData,\n            timeoutInterval: 2.5\n        )\n'''
          if old not in text:
              raise SystemExit('seed timeout marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git rm .github/workflows/seed-timeout-fix.yml
          git add TubeTV/AlternativePlayerService.swift
          git commit -m "Bound playback visitor seed timeout"
          git push origin HEAD:playback-faststart
