name: Fast stream probing patch

"on":
  push:
    branches:
      - playback-faststart
    paths:
      - .github/workflows/fast-stream-probe-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: playback-faststart

      - name: Apply fast probing patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{label} marker not found in {path}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'TubeTV/HomeView.swift',
              '''                        .buttonStyle(.plain)\n                        .onAppear {\n''',
              '''                        .buttonStyle(.plain)\n                        .focusEffectDisabled()\n                        .onAppear {\n''',
              'Home video focus effect'
          )

          replace_once(
              'TubeTV/SearchView.swift',
              '''            .buttonStyle(.plain)\n\n        case .channel(let channel):\n''',
              '''            .buttonStyle(.plain)\n            .focusEffectDisabled()\n\n        case .channel(let channel):\n''',
              'Search video focus effect'
          )

          auth = Path('TubeTV/SmartTubeAuthService.swift')
          auth_text = auth.read_text()
          marker = '''    func signedIn() -> Bool {\n        TubeTVKeychain.string(for: refreshTokenKey) != nil\n    }\n\n'''
          helper = '''    func signedIn() -> Bool {\n        TubeTVKeychain.string(for: refreshTokenKey) != nil\n    }\n\n    func cachedVisitorData() -> String? {\n        cachedBootstrap?.visitorData\n    }\n\n'''
          if marker not in auth_text:
              raise SystemExit('cachedVisitorData insertion marker not found')
          auth.write_text(auth_text.replace(marker, helper, 1))

          alt = Path('TubeTV/AlternativePlayerService.swift')
          text = alt.read_text()

          for old, new, minimum in [
              ('configuration.timeoutIntervalForRequest = 12', 'configuration.timeoutIntervalForRequest = 3', 1),
              ('configuration.timeoutIntervalForResource = 20', 'configuration.timeoutIntervalForResource = 8', 1),
              ('request.timeoutInterval = 8', 'request.timeoutInterval = 2.5', 2),
              ('request.timeoutInterval = 10', 'request.timeoutInterval = 2.5', 1),
          ]:
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'Alternative timeout marker missing: {old} count={count}')
              text = text.replace(old, new)

          old_bootstrap = '''        if visitorData == nil,\n           let bootstrap =\n                try? await SmartTubeAuthService\n                    .shared.bootstrap(),\n           let bootstrapVisitor =\n                bootstrap.visitorData,\n           !bootstrapVisitor.isEmpty {\n            visitorData = bootstrapVisitor\n        }\n'''
          new_bootstrap = '''        if visitorData == nil,\n           let bootstrapVisitor =\n                await SmartTubeAuthService\n                    .shared.cachedVisitorData(),\n           !bootstrapVisitor.isEmpty {\n            visitorData = bootstrapVisitor\n        }\n'''
          if old_bootstrap not in text:
              raise SystemExit('Alternative bootstrap marker missing')
          text = text.replace(old_bootstrap, new_bootstrap, 1)

          old_client_bootstrap = '''        let bootstrap =\n            try? await SmartTubeAuthService\n                .shared.bootstrap()\n        try Task.checkCancellation()\n\n        let bootstrapVisitor =\n            bootstrap?.visitorData\n'''
          new_client_bootstrap = '''        let bootstrapVisitor =\n            await SmartTubeAuthService\n                .shared.cachedVisitorData()\n        try Task.checkCancellation()\n'''
          if old_client_bootstrap not in text:
              raise SystemExit('Per-client bootstrap marker missing')
          text = text.replace(old_client_bootstrap, new_client_bootstrap, 1)

          ios_start = text.index('            AlternativePlayerClient(\n                profile: "IOS",')
          geo_start = text.index('            AlternativePlayerClient(\n                profile: "GEO",', ios_start)
          ios_block = text[ios_start:geo_start]
          text = text[:ios_start] + text[geo_start:]
          web_start = text.index('            AlternativePlayerClient(\n                profile: "WEB",')
          text = text[:web_start] + ios_block + text[web_start:]
          alt.write_text(text)

          stream = Path('TubeTV/StreamResolver.swift')
          s = stream.read_text()
          for old, new in [
              ('private let maximumWindow: TimeInterval = 28', 'private let maximumWindow: TimeInterval = 20'),
              ('timeoutSeconds: isInitialAttempt ? 12 : 8', 'timeoutSeconds: isInitialAttempt ? 9 : 5'),
          ]:
              if old not in s:
                  raise SystemExit(f'StreamResolver marker missing: {old}')
              s = s.replace(old, new, 1)

          auth_call = '''                return try await AuthenticatedPlayerService.shared.resolve(\n                    videoID: videoID,\n                    preferredQuality: preferredQuality\n                )\n'''
          auth_replacement = '''                return try await resolveAuthenticatedWithTimeout(\n                    videoID: videoID,\n                    preferredQuality: preferredQuality,\n                    timeoutSeconds: 3\n                )\n'''
          if auth_call not in s:
              raise SystemExit('Authenticated resolver call marker missing')
          s = s.replace(auth_call, auth_replacement, 1)

          insert_marker = '''    private static func resolveWithTimeout(\n        videoID: String,\n'''
          auth_helper = '''    private static func resolveAuthenticatedWithTimeout(\n        videoID: String,\n        preferredQuality: String,\n        timeoutSeconds: TimeInterval\n    ) async throws -> PlaybackSource {\n        let timeoutNanoseconds = UInt64(\n            max(1, timeoutSeconds) * 1_000_000_000\n        )\n\n        return try await withThrowingTaskGroup(\n            of: PlaybackSource.self\n        ) { group in\n            group.addTask {\n                try await AuthenticatedPlayerService.shared.resolve(\n                    videoID: videoID,\n                    preferredQuality: preferredQuality\n                )\n            }\n\n            group.addTask {\n                try await Task.sleep(\n                    nanoseconds: timeoutNanoseconds\n                )\n                try Task.checkCancellation()\n                throw StreamResolverError.noPlayableStream\n            }\n\n            defer { group.cancelAll() }\n\n            guard let first = try await group.next() else {\n                throw StreamResolverError.noPlayableStream\n            }\n\n            return first\n        }\n    }\n\n'''
          if insert_marker not in s:
              raise SystemExit('Authenticated timeout helper insertion marker missing')
          s = s.replace(insert_marker, auth_helper + insert_marker, 1)
          stream.write_text(s)

          player = Path('TubeTV/PlayerView.swift')
          p = player.read_text()
          for old, new in [
              ('private let maximumFailoverDuration: TimeInterval = 18', 'private let maximumFailoverDuration: TimeInterval = 12'),
              ('guard failoverDeadline.timeIntervalSinceNow >= 8 else {', 'guard failoverDeadline.timeIntervalSinceNow >= 5 else {'),
              ('// A retry resolver can consume up to eight seconds.', '// A retry resolver can consume up to five seconds.'),
              ('for _ in 0..<80 {', 'for _ in 0..<45 {'),
          ]:
              if old not in p:
                  raise SystemExit(f'Player marker missing: {old}')
              p = p.replace(old, new, 1)
          player.write_text(p)
          PY

      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git rm .github/workflows/fast-stream-probe-fix.yml
          git add TubeTV/HomeView.swift TubeTV/SearchView.swift TubeTV/SmartTubeAuthService.swift TubeTV/AlternativePlayerService.swift TubeTV/StreamResolver.swift TubeTV/PlayerView.swift
          git commit -m "Fail fast on unavailable streams and remove focus halo"
          git push origin HEAD:playback-faststart
