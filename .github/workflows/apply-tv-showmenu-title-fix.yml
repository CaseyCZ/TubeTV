name: Apply TV show menu title fix

on:
  push:
    branches:
      - playback-faststart

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: playback-faststart
          fetch-depth: 0

      - name: Apply parser fix
        run: python3 tools/apply-tv-showmenu-title-fix.py

      - name: Validate patch
        run: git diff --check

      - name: Commit product fix and remove helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-tv-showmenu-title-fix.yml tools/apply-tv-showmenu-title-fix.py
          git add TubeTV/InnerTubeService.swift
          git commit -m "Read TV titles from show menu metadata"
          git push origin HEAD:playback-faststart
