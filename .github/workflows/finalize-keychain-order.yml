name: Finalize Keychain persistence order

on:
  push:
    branches:
      - playback-faststart
    paths:
      - tools/finalize-keychain-order.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reorder durable token write
        run: python3 tools/finalize-keychain-order.py

      - name: Commit Keychain ordering fix
        run: |
          set -euo pipefail
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add TubeTV/SmartTubeAuthService.swift
          git commit -m "Commit refresh token only after session state"
          git push
