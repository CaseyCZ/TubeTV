name: Caption cancellation fix

on:
  push:
    branches:
      - playback-faststart
    paths:
      - .github/workflows/caption-cancellation-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback-faststart
          fetch-depth: 0

      - name: Propagate caption task cancellation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("TubeTV/CaptionService.swift")
          text = path.read_text()

          old_translation = (
              "            } catch {\n"
              "                // A forced translation is deliberately optimistic. If the\n"
              "                // endpoint really refuses that language, keep captions usable\n"
              "                // by falling back to the source track instead of showing none.\n"
              "                return try await loadTrack(\n"
          )
          new_translation = (
              "            } catch {\n"
              "                try Task.checkCancellation()\n"
              "\n"
              "                // A forced translation is deliberately optimistic. If the\n"
              "                // endpoint really refuses that language, keep captions usable\n"
              "                // by falling back to the source track instead of showing none.\n"
              "                return try await loadTrack(\n"
          )
          if text.count(old_translation) != 1:
              raise SystemExit("translation catch block not found exactly once")
          text = text.replace(old_translation, new_translation, 1)

          old_web = (
              "            // SmartTube supplements TV caption metadata from WEB when the\n"
              "            // TV response exposes only a reduced translation-language list.\n"
              "            if translations.count < 100,\n"
              "               let webRenderer =\n"
              "                    try? await watchPageCaptionRenderer(\n"
              "                        videoID: videoID\n"
              "                    ),\n"
              "               let webTranslations =\n"
              "                    webRenderer[\"translationLanguages\"]\n"
              "                        as? [[String: Any]],\n"
              "               webTranslations.count\n"
              "                    > translations.count {\n"
              "                renderer[\"translationLanguages\"] =\n"
              "                    webTranslations\n"
              "            }\n"
          )
          new_web = (
              "            // SmartTube supplements TV caption metadata from WEB when the\n"
              "            // TV response exposes only a reduced translation-language list.\n"
              "            if translations.count < 100 {\n"
              "                do {\n"
              "                    let webRenderer =\n"
              "                        try await watchPageCaptionRenderer(\n"
              "                            videoID: videoID\n"
              "                        )\n"
              "                    let webTranslations =\n"
              "                        webRenderer[\"translationLanguages\"]\n"
              "                            as? [[String: Any]]\n"
              "                        ?? []\n"
              "\n"
              "                    if webTranslations.count > translations.count {\n"
              "                        renderer[\"translationLanguages\"] =\n"
              "                            webTranslations\n"
              "                    }\n"
              "                } catch {\n"
              "                    try Task.checkCancellation()\n"
              "                    // WEB metadata is supplemental; keep the cached renderer\n"
              "                    // when the page request fails for a non-cancellation reason.\n"
              "                }\n"
              "            }\n"
          )
          if text.count(old_web) != 1:
              raise SystemExit("supplemental WEB caption block not found exactly once")
          text = text.replace(old_web, new_web, 1)

          path.write_text(text)
          PY

      - name: Commit fix and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/caption-cancellation-fix.yml
          git add TubeTV/CaptionService.swift
          git commit -m "Propagate caption task cancellation"
          git push origin HEAD:playback-faststart
