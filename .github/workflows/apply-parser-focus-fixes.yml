name: Apply parser and focus fixes

on:
  push:
    branches:
      - playback-faststart
    paths:
      - tools/apply-parser-focus-fixes.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply guarded fixes
        run: python3 tools/apply-parser-focus-fixes.py

      - name: Commit fixes
        run: |
          set -euo pipefail
          if git diff --quiet -- TubeTV/InnerTubeService.swift TubeTV/HomeView.swift TubeTV/SearchView.swift TubeTV/RootView.swift; then
            echo "Sources already patched"
            exit 0
          fi

          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add TubeTV/InnerTubeService.swift TubeTV/HomeView.swift TubeTV/SearchView.swift TubeTV/RootView.swift
          git commit -m "Stabilize tvOS feed titles and focus identity"
          git push
