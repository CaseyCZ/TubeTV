name: Apply hard startup budget

on:
  push:
    branches:
      - playback-faststart
    paths:
      - .github/workflows/apply-hard-startup-budget.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: playback-faststart
          fetch-depth: 0

      - name: Apply startup fixes
        run: python3 tools/apply-hard-startup-budget.py

      - name: Validate patch
        run: |
          git diff --check
          git diff --stat

      - name: Commit product fix and remove helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-hard-startup-budget.yml tools/apply-hard-startup-budget.py
          git add TubeTV/StreamResolver.swift TubeTV/AlternativePlayerService.swift TubeTV/PlayerView.swift TubeTV/InnerTubeService.swift
          git commit -m "Enforce hard playback startup budget"
          git push origin HEAD:playback-faststart

      - name: Validate product head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tvos-build.yml --ref playback-faststart
