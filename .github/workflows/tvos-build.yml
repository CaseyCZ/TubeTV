name: tvOS Build

on:
  push:
    branches:
      - Master
  workflow_dispatch:

concurrency:
  group: tvos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Build and test TubeTV in tvOS Simulator
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project TubeTV.xcodeproj \
            -scheme TubeTV

      - name: Build TubeTV
        run: |
          set -o pipefail
          xcodebuild \
            -project TubeTV.xcodeproj \
            -scheme TubeTV \
            -configuration Debug \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee simulator-build.log

      - name: Build Release for Apple TV device
        run: |
          set -o pipefail
          xcodebuild \
            -project TubeTV.xcodeproj \
            -scheme TubeTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$PWD/DerivedData-Device" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee device-release-build.log

      - name: Archive Release for Apple TV device
        run: |
          set -o pipefail
          xcodebuild \
            -project TubeTV.xcodeproj \
            -scheme TubeTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "$PWD/TubeTV.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee device-release-archive.log

          test -d "$PWD/TubeTV.xcarchive/Products/Applications/TubeTV.app"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload TubeTV-unsigned.ipa
          mkdir -p Payload
          cp -R "$PWD/TubeTV.xcarchive/Products/Applications/TubeTV.app" Payload/
          zip -qry TubeTV-unsigned.ipa Payload
          test -f TubeTV-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: TubeTV-unsigned
          path: TubeTV-unsigned.ipa
          if-no-files-found: error

      - name: Select and boot Apple TV simulator
        id: simulator
        run: |
          set -euo pipefail

          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          data=json.load(sys.stdin)
          runtimes=[
              r for r in data["runtimes"]
              if r.get("isAvailable", False)
              and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.tvOS-")
          ]
          if not runtimes:
              raise SystemExit("No available tvOS runtime")
          runtimes.sort(key=lambda r: tuple(int(x) for x in r["version"].split(".")), reverse=True)
          print(runtimes[0]["identifier"])
          ')"

          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          data=json.load(sys.stdin)
          devices=data["devicetypes"]
          preferred=[d for d in devices if d.get("name") == "Apple TV 4K (3rd generation)"]
          if not preferred:
              preferred=[d for d in devices if d.get("name", "").startswith("Apple TV")]
          if not preferred:
              raise SystemExit("No Apple TV simulator device type")
          print(preferred[0]["identifier"])
          ')"

          UDID="$(xcrun simctl create "TubeTV CI" "$DEVICE_TYPE" "$RUNTIME")"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "device_type=$DEVICE_TYPE" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and launch TubeTV
        run: |
          set -euo pipefail

          UDID='${{ steps.simulator.outputs.udid }}'
          APP_PATH="$PWD/DerivedData/Build/Products/Debug-appletvsimulator/TubeTV.app"

          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" cz.caseycz.tubetv | tee simulator-launch.txt

          sleep 12
          xcrun simctl spawn "$UDID" log show \
            --style compact \
            --last 2m \
            --predicate 'process == "TubeTV"' \
            > tubetv-simulator.log 2>&1 || true

      - name: Publish IPA to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="tvos-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="TubeTV Apple TV Build ${GITHUB_RUN_NUMBER}"

          gh release create "$TAG"             TubeTV-unsigned.ipa             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "$TITLE"             --notes "Unsigned tvOS IPA for Apple TV testing via ATVLoadly. Built from commit $GITHUB_SHA."             --prerelease

      - name: Shutdown simulator
        if: always()
        run: |
          xcrun simctl shutdown '${{ steps.simulator.outputs.udid }}' || true
          xcrun simctl delete '${{ steps.simulator.outputs.udid }}' || true
