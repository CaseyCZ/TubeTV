name: tvOS Build

on:
  push:
    branches:
      - Master
  workflow_dispatch:

concurrency:
  group: tvos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test TubeTV in tvOS Simulator
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project TubeTV.xcodeproj \
            -scheme TubeTV

      - name: Build TubeTV
        run: |
          set -o pipefail
          xcodebuild \
            -project TubeTV.xcodeproj \
            -scheme TubeTV \
            -configuration Debug \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee simulator-build.log

      - name: Select and boot Apple TV simulator
        id: simulator
        run: |
          set -euo pipefail

          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          data=json.load(sys.stdin)
          runtimes=[
              r for r in data["runtimes"]
              if r.get("isAvailable", False)
              and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.tvOS-")
          ]
          if not runtimes:
              raise SystemExit("No available tvOS runtime")
          runtimes.sort(key=lambda r: tuple(int(x) for x in r["version"].split(".")), reverse=True)
          print(runtimes[0]["identifier"])
          ')"

          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          data=json.load(sys.stdin)
          devices=data["devicetypes"]
          preferred=[d for d in devices if d.get("name") == "Apple TV 4K (3rd generation)"]
          if not preferred:
              preferred=[d for d in devices if d.get("name", "").startswith("Apple TV")]
          if not preferred:
              raise SystemExit("No Apple TV simulator device type")
          print(preferred[0]["identifier"])
          ')"

          UDID="$(xcrun simctl create "TubeTV CI" "$DEVICE_TYPE" "$RUNTIME")"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "device_type=$DEVICE_TYPE" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and launch TubeTV
        run: |
          set -euo pipefail

          UDID='${{ steps.simulator.outputs.udid }}'
          APP_PATH="$PWD/DerivedData/Build/Products/Debug-appletvsimulator/TubeTV.app"

          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" cz.caseycz.tubetv | tee simulator-launch.txt

          sleep 12
          xcrun simctl io "$UDID" screenshot tubetv-simulator.png
          xcrun simctl spawn "$UDID" log show \
            --style compact \
            --last 2m \
            --predicate 'process == "TubeTV"' \
            > tubetv-simulator.log 2>&1 || true

      - name: Verify ad filtering policy
        run: |
          set -euo pipefail

          UDID='${{ steps.simulator.outputs.udid }}'
          xcrun simctl terminate "$UDID" cz.caseycz.tubetv || true

          SIMCTL_CHILD_TUBETV_CI_AD_FILTER_SMOKE=1 \
            xcrun simctl launch "$UDID" cz.caseycz.tubetv \
            > ad-filter-launch.txt

          sleep 4
          xcrun simctl spawn "$UDID" log show \
            --style compact \
            --last 1m \
            --predicate 'subsystem == "cz.caseycz.tubetv" AND category == "CI"' \
            > tubetv-ad-filter.log 2>&1 || true

          cat tubetv-ad-filter.log
          grep -q "TUBETV_AD_FILTER_OK" tubetv-ad-filter.log

          if grep -q "TUBETV_AD_FILTER_FAILED" tubetv-ad-filter.log; then
            echo "::error::TubeTV ad filtering policy failed."
            exit 1
          fi

      - name: Probe real YouTube video playback
        run: |
          set -euo pipefail

          UDID='${{ steps.simulator.outputs.udid }}'
          xcrun simctl terminate "$UDID" cz.caseycz.tubetv || true

          # Same regression video SmartTubeIOS uses to exercise Android fallback on Simulator.
          SIMCTL_CHILD_TUBETV_CI_VIDEO_SMOKE=1 \
          SIMCTL_CHILD_TUBETV_CI_VIDEO_ID=Dy9ki9Q5nXs \
            xcrun simctl launch "$UDID" cz.caseycz.tubetv \
            > video-smoke-launch.txt

          sleep 18
          xcrun simctl io "$UDID" screenshot tubetv-video-smoke.png
          xcrun simctl spawn "$UDID" log show \
            --style compact \
            --last 3m \
            --predicate 'subsystem == "cz.caseycz.tubetv"' \
            > tubetv-video-smoke.log 2>&1 || true

          cat tubetv-video-smoke.log

          if grep -q "TUBETV_VIDEO_PLAYBACK_OK" tubetv-video-smoke.log; then
            echo "Real YouTube playback succeeded."
            exit 0
          fi

          if grep -qiE "sign in to confirm.*bot|your ip|ip address|vpn|proxy" tubetv-video-smoke.log; then
            echo "::warning::YouTube blocked the GitHub-hosted runner IP. Resolver probe captured; this is not a TubeTV build failure."
            exit 0
          fi

          echo "::error::YouTube probe failed for a reason other than the known cloud-IP block."
          exit 1

      - name: Probe live YouTube stream playback
        run: |
          set -euo pipefail

          UDID='${{ steps.simulator.outputs.udid }}'
          xcrun simctl terminate "$UDID" cz.caseycz.tubetv || true

          # Long-running 24/7 Sky News YouTube live stream.
          SIMCTL_CHILD_TUBETV_CI_VIDEO_SMOKE=1 \
          SIMCTL_CHILD_TUBETV_CI_VIDEO_ID=geXLHd4IZ8s \
            xcrun simctl launch "$UDID" cz.caseycz.tubetv \
            > live-smoke-launch.txt

          sleep 22
          xcrun simctl io "$UDID" screenshot tubetv-live-smoke.png
          xcrun simctl spawn "$UDID" log show \
            --style compact \
            --last 3m \
            --predicate 'subsystem == "cz.caseycz.tubetv"' \
            > tubetv-live-smoke.log 2>&1 || true

          cat tubetv-live-smoke.log

          if grep -q "TUBETV_VIDEO_RESOLVED videoID=geXLHd4IZ8s" tubetv-live-smoke.log \
             && grep -q "TUBETV_VIDEO_PLAYBACK_OK" tubetv-live-smoke.log; then
            echo "Live YouTube playback succeeded."
            exit 0
          fi

          if grep -qiE "sign in to confirm.*bot|your ip|ip address|vpn|proxy" tubetv-live-smoke.log; then
            echo "::warning::YouTube blocked the GitHub-hosted runner IP during the live-stream probe. This is not a TubeTV build failure."
            exit 0
          fi

          echo "::error::Live YouTube playback did not resolve and advance."
          exit 1

      - name: Verify AVPlayer video actually advances
        run: |
          set -euo pipefail

          UDID='${{ steps.simulator.outputs.udid }}'
          xcrun simctl terminate "$UDID" cz.caseycz.tubetv || true

          SIMCTL_CHILD_TUBETV_CI_VIDEO_SMOKE=1 \
          SIMCTL_CHILD_TUBETV_CI_DIRECT_URL='https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_ts/master.m3u8' \
            xcrun simctl launch "$UDID" cz.caseycz.tubetv \
            > direct-video-launch.txt

          sleep 16
          xcrun simctl io "$UDID" screenshot tubetv-direct-video.png
          xcrun simctl spawn "$UDID" log show \
            --style compact \
            --last 2m \
            --predicate 'subsystem == "cz.caseycz.tubetv" AND (category == "CI" OR category == "PlaybackFailover")' \
            > tubetv-direct-video.log 2>&1 || true

          cat tubetv-direct-video.log
          grep -q "TUBETV_DIRECT_VIDEO_STARTED" tubetv-direct-video.log
          grep -q "TUBETV_VIDEO_PLAYBACK_OK" tubetv-direct-video.log
          grep -q "PLAYBACK_DIAG .*source=HLS .*profile=UNTAGGED" tubetv-direct-video.log

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TubeTV-tvOS-Simulator
          if-no-files-found: warn
          path: |
            simulator-build.log
            simulator-launch.txt
            tubetv-simulator.png
            tubetv-simulator.log
            ad-filter-launch.txt
            tubetv-ad-filter.log
            video-smoke-launch.txt
            tubetv-video-smoke.png
            tubetv-video-smoke.log
            live-smoke-launch.txt
            tubetv-live-smoke.png
            tubetv-live-smoke.log
            direct-video-launch.txt
            tubetv-direct-video.png
            tubetv-direct-video.log

      - name: Shutdown simulator
        if: always()
        run: |
          xcrun simctl shutdown '${{ steps.simulator.outputs.udid }}' || true
          xcrun simctl delete '${{ steps.simulator.outputs.udid }}' || true
