name: tvOS Build — disabled (use external Builder)

on:
  push:
    branches:
      - playback-faststart
  workflow_dispatch:

concurrency:
  group: tvos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "TubeTV GitHub Actions build is disabled. Use the external Builder for IPA builds and testing."
