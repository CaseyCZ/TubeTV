name: Commit TubeTV tvOS Icon

on:
  push:
    branches:
      - Master
    paths:
      - ".github/workflows/commit-tvos-icon.yml"
      - "scripts/render-tvos-icon.swift"

permissions:
  contents: write

jobs:
  commit-icon:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render tvOS icon assets
        run: |
          set -euo pipefail
          xcrun --sdk macosx swift scripts/render-tvos-icon.swift \
            "TubeTV/Assets.xcassets/App Icon & Top Shelf Image.brandassets"

      - name: Commit generated icon assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TubeTV/Assets.xcassets/App Icon & Top Shelf Image.brandassets"
          if git diff --cached --quiet; then
            echo "Icon assets are already committed."
            exit 0
          fi
          git commit -m "Commit TubeTV tvOS icon assets"
          git push origin HEAD:Master
