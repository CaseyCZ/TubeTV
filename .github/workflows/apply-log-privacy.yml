name: Apply playback log privacy patch

on:
  push:
    branches:
      - playback-faststart
    paths:
      - .github/workflows/apply-log-privacy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback-faststart
          fetch-depth: 0

      - name: Harden playback log privacy
        shell: python
        run: |
          from pathlib import Path

          path = Path("TubeTV/PlayerView.swift")
          text = path.read_text(encoding="utf-8")

          replacements = {
              'STARTUP_RESOLVED video=\\(videoID, privacy: .public)': 'STARTUP_RESOLVED video=\\(videoID, privacy: .private)',
              'STARTUP_BEGIN video=\\(self.youtubeVideoID ?? "none", privacy: .public)': 'STARTUP_BEGIN video=\\(self.youtubeVideoID ?? "none", privacy: .private)',
              'PLAYBACK_DIAG videoID=\\(videoID, privacy: .public)': 'PLAYBACK_DIAG videoID=\\(videoID, privacy: .private)',
              'Using preloaded next video=\\(videoID, privacy: .public)': 'Using preloaded next video=\\(videoID, privacy: .private)',
              'Video switch failed video=\\(videoID, privacy: .public)': 'Video switch failed video=\\(videoID, privacy: .private)',
              'Saved local position video=\\(videoID, privacy: .public) position=\\(position, privacy: .public)': 'Saved local position video=\\(videoID, privacy: .private) position=\\(position, privacy: .private)',
              'Restored local position video=\\(videoID, privacy: .public) position=\\(targetSeconds, privacy: .public)': 'Restored local position video=\\(videoID, privacy: .private) position=\\(targetSeconds, privacy: .private)',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match for {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit privacy patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-log-privacy.yml
          git config user.name "Lukáš"
          git config user.email "kyselalukas@seznam.cz"
          git add TubeTV/PlayerView.swift .github/workflows/apply-log-privacy.yml
          git commit -m "Protect playback identifiers in logs"
          git push origin HEAD:playback-faststart
